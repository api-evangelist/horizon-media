- slug: horizon-media-tag-registry-trustworthy-accountability-group
  label: TAG Registry (Trustworthy Accountability Group)
  partner_name: TAG Registry (Trustworthy Accountability Group)
  category: Ad fraud / brand safety certification (TAG)
  type: register
  channel: standard-directory
  evidence: https://www.tagtoday.net/registry
  source: edge
  relationship: standard-participant
  contract_reference:
    register: TAG Registry (tagtoday.net/registry; registry-search public endpoint)
    spec_file: null
    standard: TAG certification programs (Trustworthy Accountability Group)
    role: tag-certified
    registrations:
    - registered_name: Horizon Media
      register_id: https://hubgloo.opxar.com/company/52706912158
      verified_by_tag: true
      seals:
      - Certified Against Malvertising
      - Certified For Transparency
      - Certified Against Fraud
      matched_domain: null
      matched_by: register-name
      register_name_note: register-name 'horizonmedia' = horizon-media; no wikidata P856
    signal_note: certified_products = one entry per TAG seal held (CAF, BSC, CAM, CAP, CFT), never per registration;
      validation route (third-party auditor / TAG Validation / self-attestation) and category are context. The registry
      shows current seals only and marks none expired, so lapsed is false. Verified by TAG with no seal = listing
      only (participation)
    detected_by: sweep-tag-certified-ad-fraud.py
    detected: '2026-10-23'
    certified_products:
    - product: Certified Against Fraud
      product_type: Certified Against Fraud
      standard: TAG Certified Against Fraud (CAF)
      lapsed: false
      validation:
      - self-attestation
      categories:
      - Buyer
      scope: []
    - product: Certified Against Malvertising
      product_type: Certified Against Malvertising
      standard: TAG Certified Against Malvertising (CAM)
      lapsed: false
      validation:
      - self-attestation
      categories:
      - Buyer
      scope: []
    - product: Certified For Transparency
      product_type: Certified For Transparency
      standard: TAG Certified For Transparency (CFT)
      lapsed: false
      validation:
      - TAG Validation
      categories:
      - Buyer - Advertiser or Brand appointed Agency
      scope: []
    matched_by: register-name
    identity_source: register-name
    identity_note: register gave only the name; exact normalised match to the repo's apis.yml name, one repo, Wikidata
      P856 not contradicting (Kin 2026-10-20 decision 2)
  status: not-a-workflow
  arazzo: null
